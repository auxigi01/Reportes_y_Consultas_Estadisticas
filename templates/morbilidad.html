<script>
document.addEventListener('DOMContentLoaded', () => {

    // ==========================
    // ⭐ 1. DECLARACIONES DE VARIABLES Y CONSTANTES
    // ==========================

    const linkInicio = document.getElementById("linkInicio");
    const linkAgregar = document.getElementById("linkAgregar");
    const linkConsultar = document.getElementById("linkConsultar");
    const linkSalir = document.getElementById("linkSalir");
    const pageTitle = document.getElementById("pageTitle");
    const contentDisplay = document.getElementById("contentDisplay");
    const mainContent = document.getElementById("mainContent");

    // Templates HTML para renderizar contenido dinámico
    const formularioTemplate = document.getElementById("formulario-template");
    const consultaTemplate = document.getElementById("consulta-template");
    const reportesTemplate = document.getElementById("reportes-template");
    const estadisticaTemplate = document.getElementById("estadistica-template");

    // Modales
    const modalSeleccion = document.getElementById("modalSeleccion");
    const modalClave = document.getElementById("modalClave");

    // Botones de interacción
    const btnPreempleo = document.getElementById("btnPreempleo");
    const btnHistoria = document.getElementById("btnHistoria");
    const btnEnviarClave = document.getElementById("btnEnviarClave");
    const btnCancelarClave = document.getElementById("btnCancelarClave");

    // Inputs y mensajes
    const inputClave = document.getElementById("inputClave");
    const errorClave = document.getElementById("errorClave");

    // Indicador de carga
    const loadingIndicator = document.querySelector(".modal-loading");

    // Modal de alerta personalizado
    const customAlertModal = document.getElementById('customAlertModal');
    const alertMessage = document.getElementById('alertMessage');
    const alertAcceptBtn = document.getElementById('alertAcceptBtn');


    // ==========================
    // ⭐ 2. FUNCIONES DE LÓGICA
    // ==========================

    let previousModal = null; 

    function showAlert(message) {
        alertMessage.textContent = message;

        previousModal = document.querySelector(".modal-overlay[style*='display: flex']");

        customAlertModal.style.display = 'flex';
        mainContent.classList.add("blurry"); 
    }

    function hideAlert() {
        customAlertModal.style.display = 'none';

        if (!previousModal || previousModal.style.display === "none") {
            mainContent.classList.remove("blurry");
        }
    }

    function updateDateTime() {
        const now = new Date();

        const options = {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
            hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
        };

        const formattedDatetime = now.toLocaleDateString('es-ES', options);

        const datetimeElement = document.getElementById('currentDatetime');
        if (datetimeElement) {
            datetimeElement.textContent = formattedDatetime;
        }
    }
    
    function limpiarInputClave() {
        inputClave.value = "";
    }
    
    function showModal(modal) {
        modal.style.display = "flex";
        mainContent.classList.add("blurry");

        if (modal === modalClave) {
            limpiarInputClave();
        }
    }

    function hideModal(modal) {
        if (modal) modal.style.display = "none";

        const otrosAbiertos = [...document.querySelectorAll(".modal-overlay")]
            .some(m => m.style.display === "flex");

        if (!otrosAbiertos) {
            mainContent.classList.remove("blurry");
        }

        if (modal === modalClave) {
            limpiarInputClave();
        }
    }

    function closeAllModals() {
        const modals = document.querySelectorAll(".modal-overlay");
        modals.forEach(modal => modal.style.display = "none");
        mainContent.classList.remove("blurry");
    }

    function resetModalClave() {
        inputClave.value = "";
        errorClave.textContent = "";
        loadingIndicator.style.display = "none";
        btnEnviarClave.disabled = false;
        btnCancelarClave.disabled = false;
    }

    function actualizarPlaceholder(tipo) {
        if (tipo === "preempleo") {
            inputClave.placeholder = "Número de Preempleo";
        } else if (tipo === "historia") {
            inputClave.placeholder = "Número de consultas";
        } else {
            inputClave.placeholder = "Número de clave"; 
        }
    }
    
    // ==========================
    // 🔹 FUNCIONES DE COMUNICACIÓN CON EL BACKEND (FETCH)
    // ==========================

    async function obtenerDatos(clave, tipo) {
        const url = "/obtener_datos";
        console.log(`🔍 Solicitando datos para clave: ${clave}, tipo: ${tipo}`);

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ clave: clave, tipo: tipo }),
            });

            // Manejo de error HTTP
            if (!response.ok) {
                const errorText = await response.text();
                console.error(`🚫 Error HTTP al obtener datos (Estado: ${response.status} - ${response.statusText}):`, errorText);

                showAlert(`Error al obtener el registro (Estado: ${response.status}). Por favor, revise la consola para más detalles.`);
                throw new Error("Respuesta no OK del servidor.");
            }

            const data = await response.json();
            console.log("✅ Datos obtenidos:", data);
            return data;

        } catch (error) {
            console.error("🔴 Error al procesar datos:", error);

            // Evita duplicar alerta si ya fue mostrada arriba
            if (!error.message.includes("Error al obtener el registro")) {
                showAlert("Ocurrió un error al procesar los datos del registro. Revise la consola.");
            }

            return null;
        }
    }

    async function obtenerEnfermedadesAgrupadas() {
        const url = "/get_enfermedades_y_categorias"; 

        try {
            console.log("🚀 Petición enviada a la API de enfermedades...");
            const response = await fetch(url);

            if (!response.ok) {
                const errorText = await response.text();
                console.error("🚫 Error en la respuesta del servidor:", response.status, errorText);
                throw new Error("Error al obtener las enfermedades agrupadas");
            }

            const data = await response.json();
            console.log("✅ Datos de enfermedades recibidos:", data);
            return data;

        } catch (error) {
            console.error("🔴 Error al obtener enfermedades:", error);
            return {};
        }
    }

    // ==========================
    // 🔹 RENDERIZADO DEL FORMULARIO PRINCIPAL
    // ==========================

    async function renderizarFormulario(datos, tipo, modoEdicion = true) {

        linkInicio.classList.remove('active');

        if (modoEdicion) {
            linkAgregar.classList.add('active');
            linkConsultar.classList.remove('active');
        } else {
            linkAgregar.classList.remove('active');
            linkConsultar.classList.add('active');
        }

        pageTitle.style.display = "none";

        const formContent = formularioTemplate.content.cloneNode(true);
        contentDisplay.innerHTML = "";
        contentDisplay.appendChild(formContent);

        // ==========================
        // 🔹 ASIGNACIÓN DE DATOS AL FORMULARIO
        // ==========================

        document.querySelector('input[name="nombre_afiliado"]').value = datos.nombre_afiliado || "";
        document.querySelector('input[name="apellido_afiliado"]').value = datos.apellido_afiliado || "";
        document.querySelector('input[name="cedula_afiliado"]').value = datos.cedula || "";
        document.querySelector('input[name="nombre_contratante"]').value = datos.nombre_contratante || "";
        document.querySelector('input[name="cedula_contratante"]').value = datos.contratante || "";
        
        const numeroLabel = document.getElementById('numero-label');
        const numeroInput = document.getElementById('numero_documento');

        if (numeroLabel && numeroInput) {
            if (tipo === 'preempleo') {
                numeroLabel.textContent = "Nro Preempleo:";
                numeroInput.value = datos.numero_preempleo || datos.clave || "";
            } else if (tipo === 'historia') {
                numeroLabel.textContent = "Nro Historia:";
                numeroInput.value = datos.numero_historia || datos.clave || "";
            } else if (tipo === 'consulta') {
                numeroLabel.textContent = "Nro Consulta:";

                numeroInput.value = datos.numero_consulta || datos.clave || "";
            }
        }

        // ==========================
        // 🔹 MANEJO DE MORBILIDAD
        // ==========================

        const morbilidadList = document.getElementById("morbilidad-list");
        morbilidadList.innerHTML = '';
        
        const chkLimitante = document.getElementById('chkLimitante');
        if (chkLimitante) {
            const limitanteGuardado = datos.limitante_guardado == 1;
            chkLimitante.checked = limitanteGuardado;

            chkLimitante.disabled = !modoEdicion; 
        }

        try {

            const enfermedadesAgrupadas = await obtenerEnfermedadesAgrupadas();
            
            if (Object.keys(enfermedadesAgrupadas).length === 0) {
                morbilidadList.innerHTML = `<p class="text-center text-gray-500">No hay categorías de morbilidad disponibles.</p>`;
                return;
            }
            
            const gridContainer = document.createElement("div");
            gridContainer.className = "morbilidad-grid-container";
            
            for (const categoria in enfermedadesAgrupadas) {
                if (enfermedadesAgrupadas.hasOwnProperty(categoria)) {
                    
                    const categoriaBox = document.createElement("div");
                    categoriaBox.className = "categoria-box";

                    const categoriaTitulo = document.createElement("h5");
                    categoriaTitulo.className = "categoria-titulo"; 
                    categoriaTitulo.textContent = categoria;
                    categoriaBox.appendChild(categoriaTitulo);

                    const enfermedadesDeLaCategoria = enfermedadesAgrupadas[categoria];

                    const contenedorEnfermedades = document.createElement("div");
                    contenedorEnfermedades.className = "enfermedades-flex";
                    
                    if (enfermedadesDeLaCategoria.length > 0) {

                        // Crear checkboxes dinámicamente
                        enfermedadesDeLaCategoria.forEach((enfermedad) => {
                            const id = `enfermedad-${enfermedad.codigo}`;

                            const div = document.createElement("div");
                            div.className = "checkbox-item"; 

                            const disabledAttribute = modoEdicion ? '' : 'disabled';

                            div.innerHTML = `
                                <input type="checkbox" 
                                       id="${id}" 
                                       name="enfermedades" 
                                       value="${enfermedad.codigo}" 
                                       ${disabledAttribute} />
                                <label for="${id}">${enfermedad.descripcion}</label>
                            `;

                            contenedorEnfermedades.appendChild(div);
                        });

                    } else {

                        const div = document.createElement("div");
                        div.className = "text-sm text-gray-400 italic mb-2";
                        div.textContent = "Sin enfermedades en esta categoría";
                        contenedorEnfermedades.appendChild(div);
                    }

                    categoriaBox.appendChild(contenedorEnfermedades);
                    gridContainer.appendChild(categoriaBox);
                }
            }
            
            morbilidadList.appendChild(gridContainer);

            // ==========================
            // 🔹 MARCAR ENFERMEDADES GUARDADAS
            // ==========================

            if (datos.enfermedades_guardadas && datos.enfermedades_guardadas.length > 0) {
                datos.enfermedades_guardadas.forEach(codigoEnfermedadGuardada => {
                    const idCheckbox = `enfermedad-${codigoEnfermedadGuardada}`;
                    const checkbox = document.getElementById(idCheckbox);

                    if (checkbox) {
                        checkbox.checked = true;
                    }
                });
            }
            
            const btnGuardar = document.getElementById('btnGuardar');
            if (btnGuardar) {
                btnGuardar.style.display = modoEdicion ? 'block' : 'none';
            }

        } catch (error) {
            morbilidadList.innerHTML = `
                <p class="text-center text-red-500">
                    Ocurrió un error al cargar las enfermedades. 
                    Por favor, revisa la consola para más detalles.
                </p>`;
        }
    }

function renderizarResultados(resultados) {
    const resultadosContainer = document.getElementById('resultados-consulta');
    if (resultados.length === 0) {
        resultadosContainer.innerHTML = '<p class="no-results">No se encontraron resultados para los filtros seleccionados.</p>';
        return;
    }
    let tablaHTML = `
        <table class="styled-table">
            <thead>
                <tr>
                    <th>Nro</th>
                    <th>Tipo</th>
                    <th>Fecha</th>
                    <th>Cédula</th>
                    <th>Nombre y Apellido</th>
                    <th>Contratante</th>
                    <th>Limitaciones</th>
                </tr>
            </thead>
            <tbody>
    `;
    resultados.forEach(res => {
        const nombreCompleto = res.nombre ? `${res.nombre} ${res.apellido}` : "N/A";
        const esLimitante = res.limitante == 1; 
        const limitanteTexto = esLimitante 
            ? '<span style="color: #dc2626; font-weight: 600;">Con limitaciones</span>'
            : 'Sin limitaciones';

        const fullTipo = 
            res.tipo === 'P' ? 'preempleo' : 
            res.tipo === 'H' ? 'historia' : 
            res.tipo === 'C' ? 'consulta' :
            res.tipo; 

        tablaHTML += `
            <tr data-clave="${res.clave}" data-tipo="${fullTipo}">
                <td><span class="clickable-clave">${res.clave}</span></td>
                <td>${res.tipo}</td>
                <td>${res.fecha}</td>
                <td>${res.cedula || "N/A"}</td>
                <td>${nombreCompleto}</td>
                <td>${res.contrato || "N/A"}</td>
                <td>${limitanteTexto}</td>
            </tr>
        `;
    });
    tablaHTML += `</tbody></table>`;
    resultadosContainer.innerHTML = tablaHTML;
    
    const tablaResultados = resultadosContainer.querySelector('table');
    if (tablaResultados) {
        tablaResultados.addEventListener('click', async (e) => {
            if (e.target.classList.contains('clickable-clave')) {
                const fila = e.target.closest('tr');
                const clave = fila.dataset.clave;
                const tipo = fila.dataset.tipo; 
                
                console.log(`⚡ Clic en registro de consulta. Clave: ${clave}, Tipo: ${tipo}`);
                
                contentDisplay.innerHTML = '<h2 class="loading-message">Cargando datos...</h2>';

                const datos = await obtenerDatos(clave, tipo);
                
                if (datos) {
                    renderizarFormulario(datos, tipo, false); 
                } else {
                    console.error("No se recibieron datos válidos de la función obtenerDatos.");
                }
            }
        });
    }
}

function attachConsultaFormListener() {
    const formConsulta = document.getElementById('formConsulta');
    if (formConsulta) {
        formConsulta.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fechaDesde = document.getElementById('fecha-desde').value;
            const fechaHasta = document.getElementById('fecha-hasta').value;
            const contrato = document.getElementById("contrato").value;
            const cedula = document.getElementById('cedula').value;
            const clave = document.getElementById('clave').value;

            if (!fechaDesde || !fechaHasta) {
                showAlert("Las fechas 'desde' y 'hasta' son obligatorias.");
                return;
            }
            
            const resultadosContainer = document.getElementById('resultados-consulta');
            resultadosContainer.innerHTML = '<div class="loader"></div><p class="loading-message">Buscando resultados...</p>';

            const data = {
                'fecha-desde': fechaDesde,
                'fecha-hasta': fechaHasta,
                contrato: contrato,
                cedula: cedula,
                clave: clave
            };

            try {
                const response = await fetch('/consultar', {
                    method: 'POST', headers: { 'Content-Type': "application/json" },
                    body: JSON.stringify(data)
                });
                const resultados = await response.json();

                if (response.ok) {
                    localStorage.setItem('filtroConsulta', JSON.stringify(data));
                    localStorage.setItem('resultadosConsulta', JSON.stringify(resultados));
                    renderizarResultados(resultados);
                } else {
                    resultadosContainer.innerHTML = `<p class="no-results">Error: ${resultados.error}</p>`;
                    showAlert("Error en la búsqueda: " + resultados.error);
                }
            } catch (error) {
                console.error("Error al obtener resultados:", error);
                resultadosContainer.innerHTML = `<p class="no-results">Ocurrió un error al buscar los datos.</p>`;
                showAlert("Ocurrió un error al buscar los datos.");
            }
        });
    }
}

                    confirmButtonColor: '#0f172a'

            Swal.fire({
                title: 'Procesando Emisiones',
                html: `
                    <p style="font-size: 0.9em; color: #64748b; text-align: left; margin-bottom: 10px;">
                        Rango objetivo: <b>${fInicio}</b> al <b>${fFin}</b>
                    </p>

                        style="
                            background:#0f172a;
                            color:#38bdf8;
                            font-family:'Courier New', Courier, monospace;
                            font-size:0.85em;
                            padding:12px;
                            border-radius:6px;
                            height:180px;
                            overflow-y:auto;
                            text-align:left;
                            line-height:1.5;

                    </div>

                confirmButtonColor: '#0f172a',
                confirmButtonText: 'Procesando...',
                allowOutsideClick: false,
                allowEscapeKey: false,

                didOpen: () => {
                    const btnAceptar = Swal.getConfirmButton();
                    btnAceptar.disabled = true;

                    const consola = document.getElementById('liveConsoleLog');
                    let historialMensajes = '';

                    const url = `/cierre_emision?fecha_inicio=${encodeURIComponent(fInicio)}&fecha_fin=${encodeURIComponent(fFin)}`;
                    const eventSource = new EventSource(url);

                    eventSource.onmessage = function(event) {
                        const data = JSON.parse(event.data);

                        if (data.status === 'info' || data.status === 'progress') {
                            historialMensajes += `<div>${data.msg}</div>`;
                            consola.innerHTML = historialMensajes;
                            consola.scrollTop = consola.scrollHeight;
                        }
                        else if (data.status === 'error') {
                            eventSource.close();
                            historialMensajes += `
                                <div style="color:#ef4444; margin-top:10px; font-weight:bold;">
                                    ❌ Error: ${data.msg}
                                </div>
                            `;
                            consola.innerHTML = historialMensajes;
                            consola.scrollTop = consola.scrollHeight;
                            btnAceptar.disabled = false;
                            btnAceptar.textContent = 'Aceptar';
                        }
                        else if (data.status === 'final') {
                            eventSource.close();
                            historialMensajes += `
                                <div style="color:#4ade80; margin-top:12px; padding-top:8px; border-top:1px dashed #334155; font-weight:bold;">
                                    ✔ ${data.msg}<br>
                                    ✔ Historias nuevas: ${data.procesadas}<br>
                                    ✔ Saltadas: ${data.omitidas}
                                </div>
                            `;
                            consola.innerHTML = historialMensajes;
                            consola.scrollTop = consola.scrollHeight;
                            btnAceptar.disabled = false;
                            btnAceptar.textContent = 'Aceptar';
                        }
                    };

                    eventSource.onerror = function(err) {
                        console.error("Fallo de conexión SSE:", err);
                        eventSource.close();
                        historialMensajes += `
                            <div style="color:#ef4444; margin-top:10px; font-weight:bold;">
                                ❌ Error de comunicación con el servidor.
                            </div>
                        `;
                        consola.innerHTML = historialMensajes;
                        consola.scrollTop = consola.scrollHeight;
                        btnAceptar.disabled = false;
                        btnAceptar.textContent = 'Aceptar';
                    };
                }
            });
        });
    }

async function fetchNombreContratante(contrato) {
    if (!contrato) return "";

    const contratoLimpio = String(contrato).trim().toUpperCase();

    try {
        const resp = await fetch('/obtener_nombre_contratante', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contrato: contratoLimpio }) 
        });

        const data = await resp.json();

        if (resp.ok && data?.nombre_contratante) {
            return String(data.nombre_contratante).toUpperCase();
        } else {
            console.warn("No encontrado:", data);
            return contratoLimpio;
        }

    } catch (err) {
        console.error("Error:", err);
        return contratoLimpio;
    }
}

async function handleEstadisticaSubmit(e) {
    e.preventDefault();

    const fechaDesde = document.getElementById('fecha-desde-estadistica').value;
    const fechaHasta = document.getElementById('fecha-hasta-estadistica').value;
    const contrato = document.getElementById('contrato-estadistica').value;

    if (!fechaDesde || !fechaHasta) {
        showAlert("Las fechas 'desde' y 'hasta' son obligatorias.");
        return;
    }

    const estadisticasContainer = document.getElementById('estadisticas-container');
    const data = {
        'fecha-desde': fechaDesde,
        'fecha-hasta': fechaHasta,
        'contrato': contrato
    };

    estadisticasContainer.innerHTML = '<div class="loader"></div><p class="loading-message">Generando estadística...</p>';

    try {
        const response = await fetch('/generar_estadistica', { 
            method: 'POST',
            headers: { 'Content-Type': "application/json" },
            body: JSON.stringify(data)
        });

        const resultados = await response.json();
        
        if (response.ok) {

            localStorage.setItem('filtroEstadistica', JSON.stringify(data));
            localStorage.setItem('resultadosEstadistica', JSON.stringify(resultados));
            
            renderizarEstadistica(resultados);
        } else {
            estadisticasContainer.innerHTML = `<p class="no-results">Error: ${resultados.error || 'Desconocido'}</p>`;
            showAlert("Error al generar la estadística: " + (resultados.error || 'Desconocido'));
        }
    } catch (error) {
        console.error("Error al generar la estadística:", error);
        estadisticasContainer.innerHTML = `<p class="no-results">Ocurrió un error al generar la estadística.</p>`;
        showAlert("Ocurrió un error al generar la estadística.");
    }
}

function obtenerDatosTop5(resultados) {

    const ordenados = [...resultados].sort((a, b) => (b.TOTALGENERAL || 0) - (a.TOTALGENERAL || 0));

    const top5 = ordenados.slice(0, 5);
    const resto = ordenados.slice(5);

    const datosGrafico = top5.map(item => ({
        label: item.ENFERMEDAD || 'Sin nombre',
        valor: item.TOTALGENERAL || 0
    }));

    if (resto.length > 0) {
        const sumaResto = resto.reduce((sum, item) => sum + (item.TOTALGENERAL || 0), 0);
        if (sumaResto > 0) {
            datosGrafico.push({ label: 'Otros', valor: sumaResto });
        }
    }

    return datosGrafico;
}

async function generarImagenGrafico(datos) {
    const canvas = document.createElement('canvas');

    canvas.width = 1200; 
    canvas.height = 750;
    const ctx = canvas.getContext('2d');

    const colores = ['#5D8AA8', '#CC4C4C', '#87C361', '#7D5AA8', '#4CB3C3', '#F2A84E'];
    
    ctx.fillStyle = '#C0C0C0'; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#1A1A1A';
    ctx.font = 'bold 36px Calibri, Arial';
    ctx.textAlign = 'center';
    ctx.fillText('PORCENTAJE DE CASOS CON MORBILIDAD', canvas.width / 2, 60);

    const total = datos.reduce((sum, d) => sum + d.valor, 0);
    let startAngle = 0;
    

    const centerX = 400; 
    const centerY = 400;
    const radius = 260; 

    datos.forEach((i_data, i) => {
        const sliceAngle = (2 * Math.PI * i_data.valor) / total;
        const middleAngle = startAngle + (sliceAngle / 2);
        
        ctx.fillStyle = colores[i % colores.length];
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, startAngle + sliceAngle);
        ctx.closePath();
        ctx.fill();
        
        ctx.strokeStyle = '#C0C0C0';
        ctx.lineWidth = 3;
        ctx.stroke();

        const porcentaje = ((i_data.valor / total) * 100).toFixed(1) + '%';
        const labelRadius = radius * 0.7; 
        const labelX = centerX + Math.cos(middleAngle) * labelRadius;
        const labelY = centerY + Math.sin(middleAngle) * labelRadius;

        ctx.font = 'bold 20px Arial';
        const textMetrics = ctx.measureText(porcentaje);
        const paddingH = 12;
        const paddingV = 8;
        const rectW = textMetrics.width + (paddingH * 2);
        const rectH = 34;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
        ctx.beginPath();
        ctx.roundRect(labelX - rectW / 2, labelY - rectH / 2, rectW, rectH, 8);
        ctx.fill();

        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(porcentaje, labelX, labelY);

        const xLeyenda = 800;
        const yLeyenda = 180 + (i * 60); 
        
        ctx.fillStyle = colores[i % colores.length];
        ctx.beginPath();
        ctx.roundRect(xLeyenda, yLeyenda, 30, 30, 5);
        ctx.fill();

        ctx.fillStyle = '#1A1A1A';
        ctx.textAlign = 'left';
        ctx.font = 'bold 22px Calibri, Arial';
        const labelLimpio = i_data.label.length > 30 ? i_data.label.substring(0, 27) + "..." : i_data.label;
        ctx.fillText(labelLimpio, xLeyenda + 45, yLeyenda + 22);

        startAngle += sliceAngle;
    });

    return canvas.toDataURL('image/png');
}

async function descargarExcelMorbilidad(resultadosRaw, filtros, logoBase64, analisisTexto, generarGrafico, firmaBase64, soloRetornar = false) {
    const ExcelJS = window.ExcelJS;
    if (!ExcelJS) {
        alert("ExcelJS no está cargado.");
        return null;
    }

    // =======================
    // 1. Validación y Muestra
    // =======================
    const resultados = resultadosRaw?.reporte || [];
    if (!Array.isArray(resultados) || resultados.length === 0) {
        alert("No hay datos para exportar.");
        return null;
    }
    const muestra = resultadosRaw?.muestra ?? 0;
    const preempleos = resultadosRaw?.preempleos ?? 0;
    const totalReal = Number(muestra) + Number(preempleos);

    // =======================
    // 2. Definición de Columnas
    // =======================
    const columnas = [
        { key: 'CATEGORIA', label: "CATEGORÍA", width: 30 },
        { key: 'ENFERMEDAD', label: "ENFERMEDAD", width: 32 },
        { key: 'TOTALINICIAL', label: "INICIAL", width: 12 },
        { key: 'TOTALPREVACACIONAL', label: "PRE VACACIONAL", width: 14 },
        { key: 'TOTALPOSTVACACIONAL', label: "POST VACACIONAL", width: 14 },
        { key: 'TOTALSEGUIMIENTO', label: "SEGUIMIENTO", width: 12 },
        { key: 'TOTALEGRESO', label: "EGRESO", width: 12 },
        { key: 'TOTALOTROS', label: "OTROS", width: 12 },
        { key: 'TOTALGENERAL', label: "TOTAL", width: 12 }
    ];

    const workbook = new ExcelJS.Workbook();
    const worksheet = workbook.addWorksheet("Morbilidad");

    // =======================
    // 3. Logo 
    // =======================
    if (logoBase64 && logoBase64.length > 100) {
        try {
            const logoId = workbook.addImage({ base64: logoBase64, extension: "png" });
            worksheet.addImage(logoId, {
                tl: { col: 0.2, row: 0.1 },
                ext: { width: 390, height: 100 }
            });
        } catch (err) {
            console.warn("No se pudo añadir el logo.", err);
        }
    }

    for (let i = 0; i < 6; i++) worksheet.addRow([]);

    // =======================
    // 4. Membrete Dinámico
    // =======================
    let startRow = worksheet.lastRow.number + 1;

    const addMembreteRow = (value, bold = false) => {
        const row = worksheet.getRow(startRow);
        row.getCell(1).value = value;

        row.getCell(1).value = textoIzq;
        worksheet.mergeCells(`A${startRow}:F${startRow}`);

        row.getCell(7).value = textoDer;
        worksheet.mergeCells(`G${startRow}:I${startRow}`);

        row.getCell(1).font = { name: "Calibri", size: 11, bold: boldIzq };
        row.getCell(7).font = { name: "Calibri", size: 11, bold: boldDer };

            console.warn("Error obteniendo nombre:", err);
            nombreContratanteTexto = contrato;
        }

    addMembreteRow("UNIDAD DE MEDICINA EMPRESARIAL RESCARVEN", true);
    addMembreteRow(nombreContratanteTexto || "");
    addMembreteRow(tieneContrato ? `CONTRATO: ${contrato}` : "");
    addMembreteRow("DISTRITO CAPITAL - CARACAS", true);

    if (tieneContrato) {
        addMembreteRowDoble(`FECHA: ${new Date().toLocaleDateString("es-VE")}`, `TOTAL DE ATENCIONES: ${muestra} CASOS`, false, true);
    } else {
        addMembreteRowDoble("CARACAS", `FECHA: ${new Date().toLocaleDateString("es-VE")}`, true, false);
    }

    addMembreteRow(`PERIODO: ${filtros?.['fecha-desde'] || ''} - ${filtros?.['fecha-hasta'] || ''}`);

    worksheet.addRow([]);
    worksheet.addRow([]);

    // =======================
    // 5. Título y Cabeceras
    // =======================
    const tituloRow = worksheet.addRow(["TABLA DE MORBILIDAD"]);
    worksheet.mergeCells(`A${tituloRow.number}:I${tituloRow.number}`);
    tituloRow.eachCell(cell => {
        cell.font = { name: "Calibri", bold: true, size: 14 };
        cell.alignment = { horizontal: "center" };
    });

    const headerRow = worksheet.addRow(columnas.map(c => c.label));
    headerRow.eachCell((cell, idx) => {
        cell.font = { name: "Calibri", bold: true, size: 11 };
        cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "B4C6E7" } };
        cell.alignment = {
            horizontal: "center",
            vertical: "middle",
            textRotation: idx > 2 ? 90 : 0
        };
        cell.border = { top: { style: "thin" }, left: { style: "thin" }, bottom: { style: "thin" }, right: { style: "thin" } };
    });

    // =======================
    // 6. Filas de Datos
    // =======================
    const grupos = resultados.reduce((acc, item) => {
        const cat = item.CATEGORIA || "SIN CATEGORÍA";
        (acc[cat] = acc[cat] || []).push(item);
        return acc;
    }, {});

    Object.entries(grupos).forEach(([categoria, items]) => {
        const catRow = worksheet.addRow([categoria, "", "", "", "", "", "", "", ""]);
        worksheet.mergeCells(catRow.number, 1, catRow.number, 2);
        catRow.eachCell(cell => {
            cell.font = { name: "Calibri", bold: true, size: 11 };
            cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "D9E1F2" } };
            cell.alignment = { horizontal: "left" };
            cell.border = { top: { style: "thin" }, left: { style: "thin" }, bottom: { style: "thin" }, right: { style: "thin" } };
        });

        items.forEach(r => {
            const row = worksheet.addRow([
                "",
                r.ENFERMEDAD || "",
                Number(r.TOTALINICIAL || 0),
                Number(r.TOTALPREVACACIONAL || 0),
                Number(r.TOTALPOSTVACACIONAL || 0),
                Number(r.TOTALSEGUIMIENTO || 0),
                Number(r.TOTALEGRESO || 0),
                Number(r.TOTALOTROS || 0),
                Number(r.TOTALGENERAL || 0)
            ]);

            row.eachCell((cell, col) => {
                cell.font = { name: "Calibri", size: 11 };
                cell.alignment = { horizontal: col === 2 ? "left" : "center" };
                cell.border = { top: { style: "thin" }, left: { style: "thin" }, bottom: { style: "thin" }, right: { style: "thin" } };
            });
        });
    });

    // =======================
    // 8. Gráfico 
    // =======================
    if (generarGrafico) {
        const datosParaGrafico = obtenerDatosTop5(resultados);
        if (datosParaGrafico.length > 0) {
            try {
                const graficoBase64 = await generarImagenGrafico(datosParaGrafico);
                const imageId = workbook.addImage({ base64: graficoBase64, extension: 'png' });
                let filaGrafico = worksheet.lastRow.number + 2;
                worksheet.addImage(imageId, {
                    tl: { col: 0.5, row: filaGrafico },
                    ext: { width: 700, height: 470 }
                });
                for (let i = 0; i < 26; i++) worksheet.addRow([]);
            } catch (err) {
                console.warn("No se pudo generar el gráfico en Excel.", err);
            }
        }
    }

    // =======================
    // 9. Análisis y Recomendaciones
    // =======================
    if (analisisTexto && analisisTexto.trim().length > 0) {
        worksheet.addRow([]);
        let currentRow = worksheet.lastRow.number + 1;

        const analisisTitleRow = worksheet.getRow(currentRow);
        analisisTitleRow.getCell(1).value = "ANÁLISIS Y RECOMENDACIONES";
        worksheet.mergeCells(`A${currentRow}:I${currentRow}`);
        analisisTitleRow.getCell(1).font = { name: "Calibri", bold: true, size: 12 };
        analisisTitleRow.getCell(1).alignment = { horizontal: "left" };

        let contentRowIdx = currentRow + 1;
        const analisisContentRow = worksheet.getRow(contentRowIdx);
        analisisContentRow.getCell(1).value = analisisTexto;
        worksheet.mergeCells(`A${contentRowIdx}:I${contentRowIdx}`);
        analisisContentRow.getCell(1).font = { name: "Calibri", size: 11 };
        analisisContentRow.getCell(1).alignment = { horizontal: "left", wrapText: true };
        analisisContentRow.height = Math.max(30, Math.ceil(analisisTexto.length / 110) * 16);
    }

    // =======================
    // 10. Desglose de la Muestra
    // =======================
    worksheet.addRow([]);
    let resumenRow = worksheet.lastRow.number + 2;

    let rowTitulo = worksheet.getRow(resumenRow);
    rowTitulo.getCell(1).value = "DESGLOSE DE LAS ATENCIONES";
    worksheet.mergeCells(`A${resumenRow}:I${resumenRow}`);
    rowTitulo.getCell(1).font = { name: "Calibri", bold: true, size: 12 };

    resumenRow++;
    let rowMuestra = worksheet.getRow(resumenRow);
    rowMuestra.getCell(1).value = `Atenciones Médicas (H+C): ${muestra} pacientes únicos`;
    worksheet.mergeCells(`A${resumenRow}:I${resumenRow}`);

    resumenRow++;
    let rowPre = worksheet.getRow(resumenRow);
    rowPre.getCell(1).value = `Pre-empleos realizados: ${preempleos} (No sumados a las atenciones médicas)`;
    worksheet.mergeCells(`A${resumenRow}:I${resumenRow}`);

    resumenRow++;
    let rowTotal = worksheet.getRow(resumenRow);
    rowTotal.getCell(1).value = `Total de registros procesados: ${totalReal}`;
    worksheet.mergeCells(`A${resumenRow}:I${resumenRow}`);
    rowTotal.getCell(1).font = { name: "Calibri", bold: true };

    // =======================
    // 11. Firma
    // =======================
    if (firmaBase64 && firmaBase64.length > 100) {
        try {
            const firmaId = workbook.addImage({ base64: firmaBase64, extension: "png" });
            let filaParaFirma = worksheet.lastRow.number + 2;
            worksheet.addImage(firmaId, {
                tl: { col: 6, row: filaParaFirma },
                ext: { width: 180, height: 150 }
            });
            for (let i = 0; i < 6; i++) worksheet.addRow([]);
        } catch (err) {
            console.warn("No se pudo añadir la firma al Excel.", err);
        }
    }

    columnas.forEach((col, i) => {
        worksheet.getColumn(i + 1).width = col.width;
    });

    // =======================
    // 12. Generación/Descarga
    // =======================
    const buffer = await workbook.xlsx.writeBuffer();
    if (soloRetornar) return buffer;

    const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `ReporteMorbilidad_${filtros?.['fecha-desde'] || 'inicio'}_a_${filtros?.['fecha-hasta'] || 'fin'}.xlsx`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1500);
}


async function descargarPDFMorbilidad(resultadosRaw, filtros, logoBase64, analisisTexto, generarGrafico, firmaBase64, soloRetornar = false) { 
    const dataReporte = resultadosRaw?.reporte || []; 
    const jspdf = window.jspdf; 
    if (!jspdf) { 
        alert("jsPDF no está cargado."); 
        return null; 
    } 

    const muestra = resultadosRaw?.muestra ?? 0; 
    const preempleos = resultadosRaw?.preempleos ?? 0; 
    const totalReal = Number(muestra) + Number(preempleos); 
    const totalesAtenciones = resultadosRaw?.total_consultas || {}; 
    const datosGrafico = obtenerDatosTop5(dataReporte); 

    const contrato = filtros?.contrato || ""; 
    const tieneContrato = contrato && contrato.trim() !== ""; 

    let nombreContratanteTexto = ""; 
    if (tieneContrato) { 
        try { 
            nombreContratanteTexto = await fetchNombreContratante(contrato); 
        } catch (err) { 
            nombreContratanteTexto = contrato; 
        } 
    } 

    const pdf = new jspdf.jsPDF({ orientation: "portrait", unit: "mm", format: "a4" }); 
    const docWidth = pdf.internal.pageSize.getWidth();
    
    const MARGIN_X = 12;                            
    const CONTENT_WIDTH = docWidth - (MARGIN_X * 2);  
    const RIGHT_X = MARGIN_X + CONTENT_WIDTH;        
    const CENTER_X = docWidth / 2;                   

    let y = 10; 

    const COLOR_HEADER_TABLE = '#B4C6E7'; 
    const COLOR_CATEGORIA_BG = '#E3F2FD'; 

// 2. ENCABEZADO
    if (logoBase64 && logoBase64.length > 50) { 
        try { 

            pdf.addImage(logoBase64, "PNG", MARGIN_X, y, 80, 15); 
        } catch(e) { 
            console.warn("Error logo PDF:", e); 
        } 
    } 
    
    y += 20;

    pdf.setFont("helvetica", "bold").setFontSize(8.5); 
    pdf.text("UNIDAD DE MEDICINA EMPRESARIAL RESCARVEN", MARGIN_X, y); 
    y += 3.8; 

    if (nombreContratanteTexto) { 
        pdf.setFont("helvetica", "normal"); 
        pdf.text(nombreContratanteTexto, MARGIN_X, y); 
        y += 3.8; 
    } 

    if (tieneContrato) { 
        pdf.setFont("helvetica", "normal"); 
        pdf.text(`CONTRATO: ${contrato}`, MARGIN_X, y); 
        y += 3.8; 
    } 

    pdf.setFont("helvetica", "bold"); 
    pdf.text("DISTRITO CAPITAL - CARACAS", MARGIN_X, y); 
    y += 3.8; 

    if (tieneContrato) { 
        pdf.setFont("helvetica", "normal"); 
        pdf.text(`FECHA: ${new Date().toLocaleDateString('es-VE')}`, MARGIN_X, y); 
        pdf.setFont("helvetica", "bold"); 
        y += 3.8; 
    } else { 
        pdf.setFont("helvetica", "normal"); 
        pdf.text(`FECHA DE EMISIÓN: ${new Date().toLocaleDateString('es-VE')}`, RIGHT_X, y, { align: "right" }); 
        y += 3.8; 
    } 

    pdf.setFont("helvetica", "normal"); 
    pdf.text(`PERÍODO: ${filtros["fecha-desde"] || ''} - ${filtros["fecha-hasta"] || ''}`, MARGIN_X, y); 
    y += 5; 

    pdf.setFont("helvetica", "bold").setFontSize(10); 
    pdf.text("TABLA DE MORBILIDAD", CENTER_X, y, { align: "center" }); 
    y += 3.5; 

    const datosAgrupados = dataReporte.reduce((acc, row) => { 
        const cat = row.CATEGORIA || "SIN CATEGORÍA"; 
        (acc[cat] = acc[cat] || []).push(row); 
        return acc; 
    }, {}); 

    const body = []; 
    for (const cat in datosAgrupados) { 
        datosAgrupados[cat].forEach((e, index) => { 
            let row = []; 
            if (index === 0) { 
                row.push({ content: cat, rowSpan: datosAgrupados[cat].length, styles: { fillColor: COLOR_CATEGORIA_BG, valign: "middle", halign: "center" } }); 
            } 
            row.push( 
                { content: e.ENFERMEDAD, styles: { halign: "left" } }, 
                e.TOTALINICIAL || 0, 
                e.TOTALPREVACACIONAL || 0, 
                e.TOTALPOSTVACACIONAL || 0, 
                e.TOTALSEGUIMIENTO || 0, 
                e.TOTALEGRESO || 0, 
                e.TOTALOTROS || 0, 
                { content: e.TOTALGENERAL || 0, styles: { fontStyle: "bold" } } 
            ); 
            body.push(row); 
        }); 
    } 

    const headersDisplay = ["CATEGORÍA", "ENFERMEDAD", "INICIAL", "PRE-VACAC", "POST-VACAC", "SEGUIMIENTO", "EGRESO", "OTROS", "TOTAL"]; 
    const headersTable = ["CATEGORÍA", "ENFERMEDAD", "", "", "", "", "", "", ""]; 

    pdf.autoTable({ 
        startY: y, 
        head: [headersTable], 
        body: body, 
        theme: "grid", 
        styles: { 
            fontSize: 7.5,        
            halign: "center", 
            valign: "middle", 
            cellPadding: 1.8,     
            lineColor: [0, 0, 0], 
            lineWidth: 0.2
        }, 
        headStyles: { 
            fillColor: COLOR_HEADER_TABLE, 
            textColor: 0, 
            fontStyle: "bold", 
            halign: "center", 
            valign: "middle", 
            minCellHeight: 25,    
            lineColor: [0, 0, 0], 
            lineWidth: 0.3
        }, 
        columnStyles: {  
            0: { cellWidth: 66 },  
            1: { cellWidth: 36 }, 
            2: { cellWidth: 12 }, 3: { cellWidth: 12 }, 4: { cellWidth: 12 }, 
            5: { cellWidth: 12 }, 6: { cellWidth: 12 }, 7: { cellWidth: 12 }, 8: { cellWidth: 12 } 
        }, 
        margin: { left: MARGIN_X, right: MARGIN_X }, 
        didDrawCell: function(data) { 
            if (data.section === 'head' && data.column.index >= 2) { 
                const text = headersDisplay[data.column.index]; 
                pdf.setFontSize(6.5); 
                pdf.setTextColor(0); 
                pdf.setFont("helvetica", "bold"); 
                
                const posX = data.cell.x + (data.cell.width / 2) + 1.2; 
                
                const posY = data.cell.y + data.cell.height - 3; 

                pdf.text(text, posX, posY, { angle: 90 }); 
            } 
        }
    }); 

    let finalY = Math.max(pdf.lastAutoTable.finalY + 8, 105);

    // 4. PIE DE PÁGINA EN 2 COLUMNAS
    const COLUMN_GAP = 6; 
    const colWidth = (CONTENT_WIDTH - COLUMN_GAP) / 2; 
    
    const col1_X = MARGIN_X; 

    let leftY = finalY; 
    let rightY = finalY; 

    if (generarGrafico && datosGrafico.length > 0) { 
        try { 
            const graficoBase64 = await generarImagenGrafico(datosGrafico); 
            const imgWidth = 90; 
            const imgHeight = 60; 
            
            pdf.setDrawColor(0, 0, 0);
            pdf.setLineWidth(0.3);
            pdf.rect(col1_X, leftY, imgWidth, imgHeight);
            pdf.addImage(graficoBase64, 'PNG', col1_X, leftY, imgWidth, imgHeight); 
            
            leftY += imgHeight + 4; 
        } catch (e) { console.warn("Error grafico PDF:", e); } 
    } 

    const padX = col1_X; 

    // Título
    pdf.setFont("helvetica", "bold").setFontSize(9); 
    pdf.setTextColor(44, 62, 80); 
    pdf.text("DESGLOSE DE LAS ATENCIONES", padX, leftY); 
    leftY += 5; 

    // Muestra Médica
    pdf.setFont("helvetica", "bold").setFontSize(7.8); 
    pdf.setTextColor(52, 73, 94); 
    pdf.text(`Muestra Médica (H+C): ${muestra} pacientes únicos.`, padX, leftY); 
    leftY += 4.5; 

    // Lista de ítems
    pdf.setFont("helvetica", "normal").setFontSize(7.5); 
    pdf.setTextColor(60, 60, 60); 

    const itemsDetalle = [
        `• Iniciales: ${totalesAtenciones.TOTALINICIAL || 0}`,
        `• Pre-Vacacionales: ${totalesAtenciones.TOTALPREVACACIONAL || 0}`,
        `• Post-Vacacionales: ${totalesAtenciones.TOTALPOSTVACACIONAL || 0}`,
        `• Seguimientos: ${totalesAtenciones.TOTALSEGUIMIENTO || 0}`,
        `• Egresos: ${totalesAtenciones.TOTALEGRESO || 0}`,
        `• Otros: ${totalesAtenciones.TOTALOTROS || 0}`
    ]; 

    itemsDetalle.forEach(item => { 
        pdf.text(item, padX + 2, leftY); 
        leftY += 3.8; 
    }); 

    leftY += 1.5; 

    // Pre-empleos
    pdf.setFont("helvetica", "normal").setFontSize(7.8); 
    pdf.setTextColor(52, 73, 94); 
    pdf.text(`Pre-empleos realizados: ${preempleos} (No sumados)`, padX, leftY); 
    leftY += 4.5; 

    // Total
    pdf.setFont("helvetica", "bold").setFontSize(8); 
    pdf.setTextColor(0, 0, 0); 
    pdf.text(`TOTAL DE ATENCIONES PROCESADAS: ${totalReal}`, padX, leftY);

    // --- COLUMNA DERECHA: ANÁLISIS + FIRMA --- 
    if (analisisTexto && analisisTexto.trim().length > 0) { 
        pdf.setFont("helvetica", "bold").setFontSize(8.5); 
        pdf.setTextColor(0, 0, 0); 
        pdf.text("ANÁLISIS Y RECOMENDACIONES", RIGHT_X, rightY, { align: "right" }); 
        rightY += 4; 
          
        pdf.setFont("helvetica", "normal").setFontSize(7.5); 
        const splitText = pdf.splitTextToSize(analisisTexto, colWidth); 
        pdf.text(splitText, RIGHT_X, rightY, { align: "right" }); 
          
        const alturaTexto = splitText.length * 3.5; 
        rightY += alturaTexto + 6; 
    } 

    // Firma al borde derecho
    if (firmaBase64 && firmaBase64.length > 100) { 
        const fW = 35; 
        const fH = 40; 
        const imgX = RIGHT_X - fW; 

        try { 
            pdf.addImage(firmaBase64, "PNG", imgX, rightY, fW, fH); 
        } catch(e) { console.warn("Error firma PDF:", e); } 
    } 

    // Exportación final 
    if (soloRetornar) return pdf.output('blob'); 
    pdf.save(`Morbilidad_${filtros["fecha-desde"] || 'inicio'}_a_${filtros["fecha-hasta"] || 'fin'}.pdf`); 
}

async function enviarMorbilidadPorGmail() {

    const resultadosEstadistica = JSON.parse(localStorage.getItem('resultadosEstadistica'));
    const filtros = JSON.parse(localStorage.getItem('filtroEstadistica'));

    if (!resultadosEstadistica) {
        showAlert("No hay datos para enviar.", "warning");
        return;
    }

    const destinatario = prompt("Por favor, introduce la(s) dirección(es) de correo del destinatario (separadas por coma):");
    if (!destinatario) return;

    showAlert("Generando archivos y preparando envío...", "info");

    try {
        const analisis = obtenerAnalisisParaExportar();
        const generarGrafico = document.getElementById('toggle-grafico')?.checked || false;
        const incluirFirma = document.getElementById('toggle-firma')?.checked;
        
        let firmaFinalBase64 = null; 

        if (incluirFirma) {
            const idFirma = document.getElementById('firma-selector-container')?.dataset.selectedFirma;
            if (!idFirma) {
                showAlert("Por favor, selecciona un médico antes de enviar.", "warning");
                return;
            }

            firmaFinalBase64 = (idFirma === 'firma1') ? base64Firma1 : base64Firma2;
        }


        const [excelBuffer, pdfBlob] = await Promise.all([
            descargarExcelMorbilidad(resultadosEstadistica, filtros, logoBase64, analisis, generarGrafico, firmaFinalBase64, true),
            descargarPDFMorbilidad(resultadosEstadistica, filtros, logoBase64, analisis, generarGrafico, firmaFinalBase64, true)
        ]);

        const excelBase64 = arrayBufferToBase64(excelBuffer);
        const pdfBase64 = await blobToBase64(pdfBlob);

        const dataEnvio = {
            destinatario: destinatario,
            asunto: `Reporte de Morbilidad - ${filtros['fecha-desde']} al ${filtros['fecha-hasta']}`,
            cuerpo: "Adjunto encontrará los reportes de morbilidad en formatos Excel y PDF.",
            adjuntos: [
                {
                    filename: `Reporte_Excel_Morbilidad_${filtros['fecha-desde']}.xlsx`,
                    content: excelBase64,
                    mimeType: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                },
                {
                    filename: `Reporte_PDF_Morbilidad_${filtros['fecha-desde']}.pdf`,
                    content: pdfBase64,
                    mimeType: "application/pdf"
                }
            ]
        };

        const response = await fetch('/enviar_reporte_morbilidad', {
            method: 'POST',
            headers: { 'Content-Type': "application/json" },
            body: JSON.stringify(dataEnvio)
        });

        const respuestaServidor = await response.json().catch(() => ({}));

        if (response.ok) {
            showAlert("Reporte enviado con éxito (Excel y PDF adjuntos).", "success");
        } else {
            throw new Error(respuestaServidor.error || "Error desconocido en el servidor");
        }

    } catch (error) {
        console.error("Error en enviarMorbilidadPorGmail:", error);
        showAlert("Error al enviar: " + error.message, "error");
    }
}

function arrayBufferToBase64(buffer) {
    let binary = '';
    const bytes = new Uint8Array(buffer);
    for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary);
}

function blobToBase64(blob) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.readAsDataURL(blob);
    });
}

async function enviarReportePorGmail() {
    showAlert("Generando Excel para adjuntar... por favor espere.", 'info');

    let workbook;
    try {
        workbook = await descargarExcel(true); 
        if (!workbook) {
            showAlert("No se pudo generar el archivo Excel o no hay datos.", 'error');
            return;
        }
    } catch (error) {
        console.error("Error al generar el Excel:", error);
        showAlert("Ocurrió un error inesperado al generar el archivo adjunto.", 'error');
        return;
    }

    const destinatario = prompt("Por favor, introduce la(s) dirección(es) de correo del destinatario (separadas por coma):");
    if (!destinatario) {
        showAlert("Envío cancelado. No se proporcionó ningún destinatario.", 'warning');
        return;
    }

    const cuerpoCorreo = prompt("Introduce el cuerpo del mensaje (opcional):", "Adjunto el Reporte de Morbilidad solicitado.");

    showAlert("Preparando el envío...", 'info');

    try {
        const buffer = await workbook.xlsx.writeBuffer();
        const bytes = new Uint8Array(buffer);

        let binary = '';
        const chunkSize = 0x8000;
        for (let i = 0; i < bytes.length; i += chunkSize) {
            const sub = bytes.subarray(i, i + chunkSize);
            binary += String.fromCharCode.apply(null, sub);
        }
        const attachmentBase64 = btoa(binary);

        const dataEnvio = {
            destinatario: destinatario,
            asunto: `Reporte de Morbilidad - ${new Date().toLocaleDateString("es-VE")}`,
            cuerpo: cuerpoCorreo || "Reporte adjunto.",
            adjunto: {
                filename: "ReporteMorbilidad.xlsx",
                content: attachmentBase64, 
                mimeType: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
            }
        };

        const response = await fetch('/enviar_reporte_morbilidad', {
            method: 'POST',
            headers: { 'Content-Type': "application/json" },
            body: JSON.stringify(dataEnvio)
        });

        const resultado = await response.json().catch(() => null);

        if (response.ok) {
            showAlert(`Reporte enviado con éxito a ${destinatario}.`, 'success');
        } else {
            console.error("Error backend envío:", resultado);
            showAlert("Error al enviar el correo: " + (resultado?.error || "Error desconocido."), 'error');
        }
    } catch (error) {
        console.error("Error en la solicitud de envío de correo:", error);
        showAlert("Ocurrió un error de conexión al intentar enviar el correo.", 'error');
    }
}

btnEnviarClave.addEventListener("click", async () => {
    const clave = inputClave.value.trim();
    const tipo = btnEnviarClave.dataset.tipo;
    errorClave.textContent = "";

    if (clave === "") {
        errorClave.textContent = "Por favor, ingrese un número.";
        return;
    }

    btnEnviarClave.disabled = true;
    btnCancelarClave.disabled = true;
    loadingIndicator.style.display = "block";

    try {
        const validacionUrl = tipo === "preempleo" ? "/validar_preempleo" : "/validar_historia";
        const validacionResponse = await fetch(validacionUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ clave: clave }),
        });

        if (!validacionResponse.ok) {
            throw new Error("No se encontraron datos");
        }
        const validacionData = await validacionResponse.json();
        if (!validacionData.acceso) {
            throw new Error("Clave inválida. Por favor, intente de nuevo.");
        }


        let tipoActualizado = tipo; 
        if (validacionData.tipo) {
            tipoActualizado = validacionData.tipo;
        }

        const datos = await obtenerDatos(clave, tipoActualizado);

        if (datos) {
            localStorage.setItem("estadoApp", JSON.stringify({ tipo: tipoActualizado, clave }));
            
            localStorage.removeItem("vistaActual");
            localStorage.removeItem("filtroConsulta");
            localStorage.removeItem("resultadosConsulta");
            localStorage.removeItem("filtroReporte");
            localStorage.removeItem("resultadosReporte");
            
            renderizarFormulario(datos, tipoActualizado, true);
            hideModal(modalClave);
        } else {
            throw new Error("Clave válida, pero no se pudieron obtener los datos asociados.");
        }
    } catch (error) {
        console.error("Error en el proceso:", error);
        errorClave.textContent = error.message;
    } finally {
        btnEnviarClave.disabled = false;
        btnCancelarClave.disabled = false;
        loadingIndicator.style.display = "none";
    }
});

document.addEventListener("click", async (e) => {
    if (e.target.closest("#btnGuardar")) {
        const checkboxes = document.querySelectorAll('#morbilidad-list input[type="checkbox"]:checked');
        const enfermedadesSeleccionadas = Array.from(checkboxes).map(checkbox => checkbox.value);
        
        const chkLimitante = document.getElementById('chkLimitante');
        const limitanteSeleccionada = chkLimitante ? (chkLimitante.checked ? 1 : 0) : 0; 
        
        const estadoActual = JSON.parse(localStorage.getItem("estadoApp"));
        if (!estadoActual) {
            showAlert("Error: No se encontraron datos de sesión en el navegador.");
            return;
        }
        const data = {
            tipo: estadoActual.tipo,
            clave: estadoActual.clave,
            enfermedades: enfermedadesSeleccionadas,
            limitante: limitanteSeleccionada 
        };
        try {
            const response = await fetch("/guardar_morbilidad", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data),
            });
            const result = await response.json();
            if (result.status === "success") {
                showAlert("¡Datos guardados correctamente!");
            } else {
                showAlert("Error: " + result.message);
            }
        } catch (error) {
            console.error("Error:", error);
            showAlert("Ocurrió un error al guardar los datos.");
        }
    }
});
